<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷诺数 Re 交互式演示 | 食品工程原理</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{max-width:820px;margin:20px auto;padding:0 16px;background:#f7f9fc;color:#222;}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 12px #00000014;margin-bottom:16px;}
.row{margin:14px 0;}
label{display:inline-block;width:140px;}
input[type="range"]{width:320px;margin:0 10px;}
.val{display:inline-block;width:110px;font-weight:bold;color:#0052cc;}
#canvasBox{text-align:center;margin:20px 0;}
canvas{border:1px solid #ccc;background:#fafafa;border-radius:8px;}
.result{font-size:18px;padding:12px;background:#edf4ff;border-radius:8px;margin-top:10px;}
.note{font-size:14px;color:#555;margin-top:8px;}
</style>
</head>
<body>
<div class="card">
<h2>雷诺数 Re 交互式演示</h2>
<p>公式：Re = (ρ · u · d) / μ<br>
ρ：流体密度(kg/m³)；u：流速(m/s)；d：管径(m)；μ：动力黏度(Pa·s)</p>

<div class="row">
<label>流速 u (m/s)</label>
<input type="range" id="uSlider" min="0.01" max="3.0" step="0.01" value="0.8">
<span class="val" id="uVal"></span>
</div>

<div class="row">
<label>管径 d (m)</label>
<input type="range" id="dSlider" min="0.01" max="0.5" step="0.01" value="0.1">
<span class="val" id="dVal"></span>
</div>

<div class="row">
<label>密度 ρ (kg/m³)</label>
<input type="range" id="rhoSlider" min="500" max="1200" step="10" value="1000">
<span class="val" id="rhoVal"></span>
</div>

<div class="row">
<label>黏度 μ (Pa·s)</label>
<input type="range" id="muSlider" min="0.0001" max="0.01" step="0.0001" value="0.001">
<span class="val" id="muVal"></span>
</div>

<div class="result">
雷诺数 Re = <span id="reResult">0</span>
<br>
流动状态：<strong id="flowState">-</strong>
</div>
<div class="note">判定标准：Re＜2000 层流；2000~4000 过渡流；＞4000 湍流</div>
</div>

<div id="canvasBox">
<canvas id="pipeCanvas" width="760" height="160"></canvas>
</div>

<script>
const uSlider = document.getElementById('uSlider');
const dSlider = document.getElementById('dSlider');
const rhoSlider = document.getElementById('rhoSlider');
const muSlider = document.getElementById('muSlider');

const uVal = document.getElementById('uVal');
const dVal = document.getElementById('dVal');
const rhoVal = document.getElementById('rhoVal');
const muVal = document.getElementById('muVal');
const reResult = document.getElementById('reResult');
const flowState = document.getElementById('flowState');

const canvas = document.getElementById('pipeCanvas');
const ctx = canvas.getContext('2d');

function calcRe(u, d, rho, mu){
    return rho * u * d / mu;
}

function getFlowStatus(re){
    if(re < 2000) return {text:"层流",color:"#0066cc"};
    else if(re <=4000) return {text:"过渡流",color:"#cc7700"};
    else return {text:"湍流",color:"#cc2222"};
}

//绘制管道流动简易示意
function drawPipe(re){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const y0 = 80;
    const pipeH = 70;
    //管道外框
    ctx.strokeStyle="#666";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(20,y0-pipeH/2);
    ctx.lineTo(740,y0-pipeH/2);
    ctx.lineTo(740,y0+pipeH/2);
    ctx.lineTo(20,y0+pipeH/2);
    ctx.closePath();
    ctx.stroke();

    if(re<2000){
        //层流：平行直线流线
        ctx.strokeStyle="#0066cc";
        ctx.lineWidth=1.5;
        for(let i=-30;i<=30;i+=12){
            ctx.beginPath();
            ctx.moveTo(40,y0+i);
            ctx.lineTo(720,y0+i);
            ctx.stroke();
        }
        ctx.fillStyle="#0066cc";
        ctx.font="16px sans-serif";
        ctx.fillText("层流：平行流线",320,145);
    }else if(re<=4000){
        //过渡流：细密波浪线，峰距小
        ctx.strokeStyle="#cc7700";
        ctx.lineWidth=1.5;
        const waveAmp = 4;    //波浪振幅
        const waveLen = 18;   //波浪峰距，越小波浪越密
        for(let i=-30;i<=30;i+=12){
            ctx.beginPath();
            for(let x=40;x<=720;x+=2){
                let offsetY = waveAmp * Math.sin( 2*Math.PI * (x / waveLen) );
                let py = y0 + i + offsetY;
                if(x===40){
                    ctx.moveTo(x, py);
                }else{
                    ctx.lineTo(x, py);
                }
            }
            ctx.stroke();
        }
        ctx.fillStyle="#cc7700";
        ctx.font="16px sans-serif";
        ctx.fillText("过渡流：波浪扰动流线",290,145);
    }else{
        //湍流 混乱短线模拟漩涡 【修复此处循环条件】
        ctx.strokeStyle="#cc2222";
        ctx.lineWidth=1.2;
        for(let k=0;k<60;k++){
            let x=60+Math.random()*660;
            let y=y0-35+Math.random()*70;
            let len=4+Math.random()*12;
            let ang=Math.random()*Math.PI*2;
            ctx.beginPath();
            ctx.moveTo(x,y);
            ctx.lineTo(x+len*Math.cos(ang), y+len*Math.sin(ang));
            ctx.stroke();
        }
        ctx.fillStyle="#cc2222";
        ctx.font="16px sans-serif";
        ctx.fillText("湍流：紊乱漩涡",310,145);
    }
}

function update(){
    const u = parseFloat(uSlider.value);
    const d = parseFloat(dSlider.value);
    const rho = parseFloat(rhoSlider.value);
    const mu = parseFloat(muSlider.value);

    uVal.textContent = u.toFixed(2)+" m/s";
    dVal.textContent = d.toFixed(3)+" m";
    rhoVal.textContent = rho.toFixed(0)+" kg/m³";
    muVal.textContent = mu.toFixed(4)+" Pa·s";

    const Re = calcRe(u,d,rho,mu);
    reResult.textContent = Re.toFixed(2);
    const status = getFlowStatus(Re);
    flowState.textContent = status.text;
    flowState.style.color = status.color;

    drawPipe(Re);
}

uSlider.addEventListener('input',update);
dSlider.addEventListener('input',update);
rhoSlider.addEventListener('input',update);
muSlider.addEventListener('input',update);

update();
</script>
</body>
</html>
