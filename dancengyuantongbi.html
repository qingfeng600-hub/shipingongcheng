<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单层圆筒壁稳态热传导｜同心圆等温面</title>
    <style>
        * {box-sizing: border-box;margin: 0;padding: 0;font-family: "Microsoft Yahei", sans-serif;}
        body {background: #f4f7fa;padding: 20px;max-width: 1250px;margin: 0 auto;}
        .container {background: #fff;padding: 24px;border-radius: 12px;box-shadow: 0 2px 12px rgba(0,0,0,0.1);}
        h2 {text-align: center;color: #2c3e50;margin-bottom: 20px;}
        .input-wrap {display: grid;grid-template-columns: repeat(auto-fit, minmax(200px,1fr));gap:14px;margin-bottom:18px;}
        .item label {display:block;margin-bottom:5px;color:#34495e;font-size:14px;}
        .item input {width:100%;padding:7px 9px;border:1px solid #cbd5e0;border-radius:6px;font-size:14px;}
        .tip {font-size:13px;color:#666;margin:4px 0;}
        #canvasBox {width:100%;height:560px;border:1px solid #ddd;border-radius:8px;margin:8px 0;position:relative;}
        canvas {width:100%;height:100%;}
        .slider-area {margin:16px 0;padding:14px;background:#f7f9fc;border-radius:8px;}
        #posSlider {width:100%;margin:10px 0;}
        .show-text {font-size:16px;color:#2b6cb0;font-weight:500;margin-top:8px;}
        button {padding:8px 18px;background:#2b7bba;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;}
    </style>
</head>
<body>
<div class="container">
    <h2>单层圆筒壁稳态径向热传导｜同心圆等温面演示</h2>
    <div class="input-wrap">
        <div class="item">
            <label>圆筒内壁半径 r₁ (m)</label>
            <input type="number" id="r1" value="0.08" step="0.001">
            <div class="tip">小圆，高温内壁</div>
        </div>
        <div class="item">
            <label>圆筒外壁半径 r₂ (m)</label>
            <input type="number" id="r2" value="0.18" step="0.001">
            <div class="tip">大圆，低温外壁</div>
        </div>
        <div class="item">
            <label>内壁温度 T₁ (℃)</label>
            <input type="number" id="t1" value="300">
            <div class="tip">r=r₁ 高温侧</div>
        </div>
        <div class="item">
            <label>外壁温度 T₂ (℃)</label>
            <input type="number" id="t2" value="80">
            <div class="tip">r=r₂ 低温侧</div>
        </div>
        <div class="item">
            <label>导热系数 λ (W/(m·K))</label>
            <input type="number" id="lambda" value="45" step="0.1">
        </div>
    </div>
    <button id="refreshBtn">刷新仿真</button>

    <div id="canvasBox">
        <canvas id="chartCanvas"></canvas>
    </div>

    <div class="slider-area">
        <label>拖动滑块：观测圆筒内部径向半径 r（从圆心算起）</label>
        <input type="range" id="posSlider" min="0.08" max="0.18" step="0.001" value="0.13">
        <div class="show-text" id="infoText">r = -- m ｜温度 T = -- ℃</div>
        <div class="tip">圆筒壁温度沿对数曲线变化；等温面为同心圆</div>
    </div>
</div>

<script>
const canvas = document.getElementById("chartCanvas");
const ctx = canvas.getContext("2d");
const refreshBtn = document.getElementById("refreshBtn");
const posSlider = document.getElementById("posSlider");
const infoText = document.getElementById("infoText");

function resizeCanvas(){
    const box = document.getElementById("canvasBox");
    canvas.width = box.clientWidth;
    canvas.height = box.clientHeight;
    drawAll();
}
window.addEventListener("resize", resizeCanvas);

//单层圆筒壁温度
function cylinderTemp(r, r1, r2, T1, T2){
    if(r <= r1) return T1;
    if(r >= r2) return T2;
    const lnRatio = Math.log(r2 / r1);
    return T1 - (T1 - T2)/lnRatio * Math.log(r / r1);
}
//单位管长热流量
function calcQL(r1,r2,lam,T1,T2){
    return 2 * Math.PI * lam * (T1 - T2) / Math.log(r2/r1);
}

function drawCirclePx(cx,cy,pxR){
    ctx.beginPath();
    ctx.arc(cx, cy, pxR, 0, Math.PI*2);
    ctx.stroke();
}
function drawFilledCirclePx(cx,cy,pxR){
    ctx.beginPath();
    ctx.arc(cx, cy, pxR, 0, Math.PI*2);
    ctx.fill();
}

function drawAll(){
    const r1 = Number(document.getElementById("r1").value);
    const r2 = Number(document.getElementById("r2").value);
    const T1 = Number(document.getElementById("t1").value);
    const T2 = Number(document.getElementById("t2").value);
    const lam = Number(document.getElementById("lambda").value);

    if(r2 <= r1){
        infoText.innerText = "错误：外壁半径r₂必须大于内壁半径r₁";
        return;
    }

    posSlider.min = r1;
    posSlider.max = r2;
    let rObs = Number(posSlider.value);
    rObs = Math.max(r1, Math.min(r2, rObs));
    posSlider.value = rObs;
    const TObs = cylinderTemp(rObs, r1, r2, T1, T2);
    const qL = calcQL(r1, r2, lam, T1, T2);

    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0,0,w,h);
    const pad = {left:70, right:40, top:20, bottom:80};
    const baseAxisLeft = pad.left;
    const baseAxisRight = w - pad.right;
    const basePlotW = baseAxisRight - baseAxisLeft;

    //曲线图整体缩小30%，居中放置
    const plotTotalW = basePlotW * 0.70;
    const axisLeft = baseAxisLeft + (basePlotW - plotTotalW)/2;
    const axisRight = axisLeft + plotTotalW;

    //圆筒圆心向下移动，保证图形完整显示，缩放系数0.384不变
    const cyCenterX = axisLeft + plotTotalW / 2;
    const cyCenterY = 120;
    const displayMaxPxR = basePlotW / 2 * 0.85 * 0.384;
    const scale = displayMaxPxR / r2;
    const pxR1 = r1 * scale;
    const pxR2 = r2 * scale;
    const pxRObs = rObs * scale;

    //绘制环形圆筒壁
    ctx.beginPath();
    ctx.arc(cyCenterX, cyCenterY, pxR2, 0, Math.PI*2);
    ctx.arc(cyCenterX, cyCenterY, pxR1, 0, Math.PI*2, true);
    ctx.fillStyle="#d8dee8";
    ctx.fill();
    ctx.strokeStyle="#222";
    ctx.lineWidth=2;
    drawCirclePx(cyCenterX, cyCenterY, pxR1);
    drawCirclePx(cyCenterX, cyCenterY, pxR2);

    //圆心标记 O
    ctx.fillStyle="#000000";
    drawFilledCirclePx(cyCenterX, cyCenterY,4);
    ctx.font="13px sans-serif";
    ctx.fillText("圆心 O", cyCenterX+8, cyCenterY-8);

    //红色虚线观测等温同心圆
    ctx.setLineDash([6,4]);
    ctx.strokeStyle="#e74c3c";
    ctx.lineWidth=2;
    drawCirclePx(cyCenterX, cyCenterY, pxRObs);
    ctx.setLineDash([]);

    ctx.fillStyle="#c0392b";
    ctx.font="13px sans-serif";
    ctx.fillText("高温内壁 r₁", cyCenterX + pxR1 + 8, cyCenterY);
    ctx.fillStyle="#2980b9";
    ctx.fillText("低温外壁 r₂", cyCenterX + pxR2 + 8, cyCenterY);
    ctx.fillStyle="#c0392b";
    ctx.fillText("等温面 r", cyCenterX + pxRObs + 6, cyCenterY -12);

    //T‑r曲线图
    const chartTop = 220;
    const chartBot = h - pad.bottom;
    ctx.beginPath();
    ctx.moveTo(axisLeft, chartTop);
    ctx.lineTo(axisLeft, chartBot);
    ctx.lineTo(axisRight, chartBot);
    ctx.lineWidth=2;
    ctx.strokeStyle="#444";
    ctx.stroke();

    ctx.fillStyle="#222";
    ctx.font="14px sans-serif";
    ctx.fillText("径向半径 r (m)", (axisLeft+axisRight)/2 -70, h-15);
    ctx.save();
    ctx.translate(22, (chartTop+chartBot)/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText("温度 T (℃)",0,0);
    ctx.restore();

    const tMin = Math.min(T1,T2);
    const tMax = Math.max(T1,T2);

    //对数温度曲线
    ctx.beginPath();
    const sample=200;
    for(let i=0;i<=sample;i++){
        const ratio = i/sample;
        const rv = r1 + ratio*(r2-r1);
        const tv = cylinderTemp(rv, r1, r2, T1, T2);
        const px = axisLeft + ratio*plotTotalW;
        const py = chartBot - ((tv-tMin)/(tMax-tMin))*(chartBot-chartTop);
        if(i===0) ctx.moveTo(px,py);
        else ctx.lineTo(px,py);
    }
    ctx.strokeStyle="#e64a19";
    ctx.lineWidth=3;
    ctx.stroke();

    //边界圆点
    const p0x = axisLeft;
    const p0y = chartBot - ((T1-tMin)/(tMax-tMin))*(chartBot-chartTop);
    const pdx = axisRight;
    const pdy = chartBot - ((T2-tMin)/(tMax-tMin))*(chartBot-chartTop);
    ctx.fillStyle="#d32f2f";
    drawFilledCirclePx(p0x,p0y,5);
    drawFilledCirclePx(pdx,pdy,5);

    //观测点蓝色标记
    const obsRatio = (rObs - r1)/(r2 - r1);
    const obsPx = axisLeft + obsRatio*plotTotalW;
    const obsPy = chartBot - ((TObs-tMin)/(tMax-tMin))*(chartBot-chartTop);
    ctx.fillStyle="#2196f3";
    drawFilledCirclePx(obsPx, obsPy,7);
    ctx.beginPath();
    ctx.setLineDash([4,4]);
    ctx.moveTo(obsPx, chartTop);
    ctx.lineTo(obsPx, chartBot);
    ctx.strokeStyle="#2196f3";
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle="#2b6cb0";
    ctx.font="13px sans-serif";
    ctx.fillText("λ="+lam+" W/(m·K)，单位管长热流量 q_L = "+qL.toFixed(2)+" W/m", pad.left,18);
    infoText.innerText = "观测径向半径 r = "+rObs.toFixed(4)+" m ｜圆筒壁等温面温度 T = "+TObs.toFixed(2)+" ℃";
}

refreshBtn.onclick = function(){ drawAll(); };
posSlider.oninput = function(){ drawAll(); };

//延迟加载，保证DOM布局完成
window.onload = function(){
    setTimeout(resizeCanvas,100);
};
</script>
</body>
</html>
